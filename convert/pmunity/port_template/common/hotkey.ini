# gptokeyb2 (PortMaster's $GPTOKEYB2). The game reads the pad itself (ua_host: SDL2 GameController ->
# an Android gamepad; pad buttons that press keys: UA_KEYMAP in port.env), so no button is bound
# here: gptokeyb2 only provides PortMaster's exit hotkey. The [controls] section stays, even empty:
# without one gptokeyb2 turns on its Start + D-pad down text entry, which would type into the game.
[config]
deadzone_triggers = 3000
deadzone_mode = axial
deadzone = 2000

[controls]
