# ------------------------------------------------------------------ games with their own ports

[[game]]
slug = "cuphead"
route = "shaders"
unity = "2017.4.9f1"
covers = ["2017.4", "full-port", "macos"]
# its port's config (portmaster-cuphead convert/cuphead.json): shaders and settings
convert = { steps = ["shaders", "settings"], shaders = { precision = "default-samplers", bundles = "^tmpfont_", glcore4x = false, compute = false }, settings = { graphics_apis = [11, 17], mouse_events = false, trim_joystick_axes = true } }

[[game]]
slug = "hollowknight"
route = "shaders"
unity = "6000.0.61f1"
covers = ["6000.0", "full-port", "linux"]

[[game]]
slug = "cuphead-title"
route = "prebuilt"
covers = ["2017.4", "full-port", "runtime"]
levels = ["rig"]
rig = { seconds = 600, shots = [200, 400, 580], content = [580], log = ["warmup for scene_title"], frames_min = 50 }

# ------------------------------------------------------------------ the game's own Android build (apk)

[[game]]
slug = "apk-imperium"
route = "apk"
covers = ["2020.3", "apk", "il2cpp-arm64"]
levels = ["fast", "rig"]
apk = { target = "arm64" }
rig = { arch = "arm64", seconds = 150, shots = [40, 90, 140], content = [140], frames_min = 300 }

[[game]]
slug = "apk-calculords"
route = "apk"
covers = ["2022.3", "apk", "mono-armv7", "gles2"]
levels = ["fast", "rig"]
apk = { target = "armhf" }
# under QEMU it stops drawing after its story screen at times and does not pause at the end
# (killed: exit 137), as in its first runs (2026-10-20): the picture is checked before that
rig = { arch = "armhf", seconds = 240, shots = [60, 140, 220], content = [60, 140], frames_min = 20, exit = [124, 137] }

[[game]]
slug = "apk-catcove"
