# ------------------------------------------------------------------ box64 route (the game's own Linux player)

[[game]]
slug = "x64-techium"
route = "box64"
unity = "5.5.1f1"
covers = ["5.5", "box64", "mono"]
any_unity_version = true
expect = { box64_fits = true }

[[game]]
slug = "x64-c4r"
route = "box64"
unity = "2020.3.28f1"
covers = ["2020.3", "box64", "il2cpp-x64"]
# the settings step fails on this IL2CPP build's globalgamemanagers (UnityPy: read_i_array out of
# bounds; known since the box64 route's first runs, 2026-10-20): its shaders only
convert = { steps = ["shaders"] }
expect = { box64_fits = true, android_fits = false }

[[game]]
slug = "x64-coldapples"
route = "box64"
unity = "6000.6.4f1"
covers = ["6000.6", "box64", "mono"]
expect = { box64_fits = true }
