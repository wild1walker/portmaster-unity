# tools/regress/games.toml: the regression run's games (README.md). One or two per Unity line and
# per route or feature, from docs/compat/games.md. Games are named by their corpus slug (the
# corpus' games/<slug>/; where the corpus is comes from local.toml); nothing else about them is
# here, and nothing of them is in the repository.
#
# [[game]]
#   slug        the corpus slug (games/<slug>/game), or a [games] key of local.toml
#   id          the run's name for it when one slug is in the list twice (default: slug)
#   route       android (desktop data -> the 32-bit Mono player) | il2cpp (pmunity il2cpp, the 64-bit
#               player) | apk (pmunity apk) | box64 (pmunity route, GLES mode) | shaders (the shaders
#               step only: a game converted by its own port) | prebuilt (rig only: a game packaged
#               before, run with the runtime under test)
#   unity       the Unity version the data must be
#   covers      what it stands for (shown in the table; --only matches it)
#   levels      fast, rig
#   pack        fast level: android-data none | tree (--pack none: the tree, its checks) | all (+ APK, OBB);
#               a handful of small games, one per Unity era and packing feature: android-data writes
#               the whole game (the rig level packs every game it runs; --pack all packs them all)
#   convert     pmunity convert config over the generic one (shaders + settings, GLES3 only, d3d11
#               for Windows builds, what `port check` suggests)
#   asmpatch, streaming_assets   android-data / il2cpp options over the check's suggestions
#   android_data  more android-data arguments
#   env, input  the rig's environment (over the check's suggested UA_*) and UA_INPUT_SCRIPT
#   expect      fast-level expectations: shaders_min, not_translatable_max, compute_min,
#               d3d11_min / metal_min / vulkan_min, route, android_fits, box64_fits,
#               verify_problems_max (android-data's verify: problems a game's build is known to have)
#   rig         seconds, shots (s after ua_host starts), content (shot times that must show a
#               picture: not black, not one colour), frames_min, log / log_absent (regexes),
#               exit (allowed codes, default [124] = still running when the time was up),
#               exceptions_max, arch (apk: armhf | arm64)
# Every level also compares with the recorded baseline (baseline/<level>.json).

# The expectations (expect, rig) are what docs/compat/games.md records for each game: the shaders
# translated (and left out), the screen it reaches in the rig. frames_min only says the game keeps
# drawing: the rig's frame rate depends on the Mac's load (about a third of a quiet Mac's with
# another job in Docker), and the baseline comparison takes it from there.

