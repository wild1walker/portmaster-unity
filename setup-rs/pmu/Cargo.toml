[package]
name = "pmu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The setup's tools in one static binary: the commands of `python -m pmunity` that a port's setup runs"

[[bin]]
name = "pmu"
path = "src/main.rs"

[dependencies]
androiddata = { path = "../crates/androiddata" }
apk = { path = "../crates/apk" }
pkgzip = { path = "../crates/pkgzip" }
convert = { path = "../crates/convert" }
il2cpp = { path = "../crates/il2cpp" }
unityfs = { path = "../crates/unityfs" }
libc = "0.2"
