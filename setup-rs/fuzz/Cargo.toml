[package]
name = "pmu-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"
description = "Fuzz targets (cargo-fuzz, libFuzzer) for the parsers pmu runs on untrusted bytes; seeds made up by examples/seeds.rs"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pkgzip = { path = "../crates/pkgzip" }
unityfs = { path = "../crates/unityfs" }
texcodec = { path = "../crates/texcodec" }
shaderx = { path = "../crates/shaderx", features = ["tree"] }
convert = { path = "../crates/convert" }
androiddata = { path = "../crates/androiddata" }
serde_json = "1"

[dev-dependencies]   # (the seeds example: made-up archives and streams)
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
crc32fast = "1"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz", "encoder"] }

# (a workspace of its own: the setup's builds and tests leave it out)
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "zip"
path = "fuzz_targets/zip.rs"
test = false
doc = false
bench = false

