[package]
name = "unityfs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Unity's files as the setup's Python (pmunity, UnityPy 1.25.4) reads and writes them: UnityFS bundles, serialized files, type trees and object values"

[dependencies]
# LZ4 and LZ4 HC: the C library python-lz4 4.4.5 bundles (1.9.4), for the same compressed bytes
lz4-sys = "=1.9.4"
# LZMA blocks (decompression only: the setup never writes LZMA)
lzma-rs = { version = "0.3", default-features = false }
