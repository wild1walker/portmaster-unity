[package]
name = "convert"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The setup's convert job (python -m pmunity convert): its journal and the steps shaders, settings, audio, textures and Cuphead's animclips, on unityfs, shaderx and texcodec"

[dependencies]
unityfs = { path = "../unityfs" }
shaderx = { path = "../shaderx", features = ["tree"] }
texcodec = { path = "../texcodec" }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
# statvfs for the free-space check (need_space), without unsafe code here
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
