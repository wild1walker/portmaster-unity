[package]
name = "picdiff"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "`picdiff frames` / `picdiff tex`: how far two pictures of the same frames or textures are apart (PSNR, SSIM, the largest difference, pixels off by more than 8), the worst one and its worst region as PNG crops side by side (docs/quality.md, \"Picture changes no one sees\")"

[[bin]]
name = "picdiff"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"
