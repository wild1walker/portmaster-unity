[package]
name = "texcodec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The textures step's work on one texture: decoding, Pillow's resize, ASTC encoding with the guide (textures.py, astc_guide.py) as pure functions"

[dependencies]
miniz_oxide = "0.8"
regex = "1"
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
