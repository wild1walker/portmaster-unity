[package]
name = "androiddata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "android-data and patch-obb pack: the APK and OBBs Unity's Android player reads, from a game's converted data, as the setup's Python writes them"

[dependencies]
unityfs = { path = "../unityfs" }
pkgzip = { path = "../pkgzip" }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
crc32fast = "1"
libc = "0.2"
