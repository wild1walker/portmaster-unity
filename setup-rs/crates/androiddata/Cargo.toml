[package]
name = "androiddata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "android-data and patch-obb pack: the APK and OBBs Unity's Android player reads, from a game's converted data, as the setup's Python writes them"

[dependencies]
unityfs = { path = "../unityfs" }
pkgzip = { path = "../pkgzip" }
shaderx = { path = "../shaderx", features = ["tree"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
crc32fast = "1"
# (--il2cpp: the stamps libunity re-extracts IL2CPP's data by, from the metadata's sha256)
sha2 = "0.10"
libc = "0.2"
