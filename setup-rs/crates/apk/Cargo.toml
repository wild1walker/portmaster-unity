[package]
name = "apk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "`apk`: a game's own Android build (APK, split APKs, XAPK, APKS, AAB, OBBs) laid out for ua_host, as the setup's Python (apk.py) does it"

[dependencies]
pkgzip = { path = "../pkgzip" }
androiddata = { path = "../androiddata" }
# (--il2cpp --on-device: the Mono build compiled for the arm64 IL2CPP player)
il2cpp = { path = "../il2cpp" }
unityfs = { path = "../unityfs" }
crc32fast = "1"
libc = "0.2"
# (zlib's own deflate, built from the crate's copy of zlib: Python's zipfile compresses with the
# system's zlib, and zlib-rs's output differs from it)
libz-sys = { version = "1", default-features = false, features = ["static"] }
