[package]
name = "shaderx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The shaders step's work on one shader: Unity's shader program blobs, OpenGL Core GLSL to GLSL ES, GLES3 programs for a Shader"

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
# (grab_fetch's exact rational arithmetic, as the Python's Fraction)
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-rational = { version = "0.4", default-features = false, features = ["std", "num-bigint"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1"
