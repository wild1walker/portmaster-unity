[package]
name = "port"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The port packager (port.py `port new` and `port package`): a port's folder from port.toml and the route's templates, and its PortMaster release zip"

[dependencies]   # (pure Rust: zlib-rs for deflate, as pkgzip)
pkgzip = { path = "../pkgzip" }
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
crc32fast = "1"
libc = "0.2"
