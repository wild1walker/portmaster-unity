[workspace]
resolver = "2"
members = ["pmu", "crates/androiddata", "crates/pkgzip", "crates/shaderx", "crates/unityfs"]   # (each crate under crates/ is added here)

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
